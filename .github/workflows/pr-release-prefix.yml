name: pr-release-prefix

# Path-aware release gating. release-please decides releases purely from the
# conventional-commit prefix on the squash commit, and GitHub uses the PR title
# as that subject (repo setting squash_merge_commit_title=PR_TITLE). This job
# normalizes the PR title so the release decision follows what changed, not
# whether the author remembered a prefix:
#
#   feat:                       -> release (minor), left as-is
#   fix: / perf:                -> release (patch), left as-is
#   chore: / refactor:          -> release, rewritten to fix: (patch)
#   docs: test: style: ci: build: -> skip, left as-is
#   no prefix, ships code       -> rewritten to feat: (minor)
#   no prefix, only non-shipping -> left as-is (skips)
#
# Non-shipping paths never ship to skill consumers: tests/, docs/, .github/,
# .codex/, .gitignore, LICENSE, root-level *.md, and release tooling. Everything
# else ships (skills/, triage_shared/, the version manifests).

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  normalize-title:
    runs-on: ubuntu-latest
    # Never touch release-please's own release PRs (it would rewrite
    # "chore(main): release X" to fix: and break release detection), and skip
    # fork PRs where the token is read-only anyway.
    if: >
      !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Normalize PR title to the right conventional prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # A path is non-shipping if it never reaches skill consumers.
          is_skipped() {
            case "$1" in
              tests/*|docs/*|.github/*|.codex/*) return 0 ;;
              .gitignore|LICENSE|release-please-config.json|.release-please-manifest.json) return 0 ;;
              *.md)
                # root-level markdown skips; nested markdown (skills/*/SKILL.md) ships
                case "$1" in
                  */*) return 1 ;;
                  *) return 0 ;;
                esac ;;
              *) return 1 ;;
            esac
          }

          type=$(printf '%s' "$TITLE" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')

          new_title="$TITLE"
          case "$type" in
            feat|fix|perf)
              echo "Title already has a releasing prefix ('$type:'); leaving as-is." ;;
            docs|test|style|ci|build)
              echo "Title has a non-releasing prefix ('$type:'); leaving as-is (no release)." ;;
            chore|refactor)
              # User policy: chore/refactor release. release-please cannot bump on
              # them, so rewrite to fix: (patch), preserving scope and '!'.
              new_title=$(printf '%s' "$TITLE" | sed -E 's/^(chore|refactor)((\([^)]*\))?!?:)/fix\2/')
              echo "Rewriting '$type:' -> fix: so it releases." ;;
            *)
              # No recognized conventional prefix: paths decide.
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
              substantive=0
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                if ! is_skipped "$f"; then substantive=1; break; fi
              done <<< "$files"
              if [ "$substantive" -eq 1 ]; then
                new_title="feat: $TITLE"
                echo "Untyped PR touches shipping files; prepending feat: (minor)."
              else
                echo "Untyped PR touches only non-shipping paths; leaving as-is (skips)."
              fi ;;
          esac

          if [ "$new_title" != "$TITLE" ]; then
            gh pr edit "$PR" --repo "$REPO" --title "$new_title"
            echo "Title updated: '$TITLE' -> '$new_title'"
          else
            echo "No title change needed."
          fi
